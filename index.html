<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>دوام — Dawam | نظام الحضور وساعات العمل والرواتب</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <meta name="description" content="Dawam - Attendance & Payroll Hours System. Offline PWA for tracking attendance, overtime, late penalties, and payroll.">
  <meta name="theme-color" content="#05070d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dawam">
  
  <!-- Web Manifest & Icons -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <!-- Google Fonts: Tajawal (Arabic), Orbitron (Numbers/Headings), Inter (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/layout.css">
</head>
<body>
  <div class="app-shell">
    
    <!-- Desktop & Tablet Sidebar (≥ 768px) -->
    <aside class="sidebar" aria-label="Sidebar Navigation">
      <div class="sidebar-brand">
        <div class="brand-icon">د</div>
        <div class="brand-info">
          <span class="brand-title" data-i18n="app.title">دوام</span>
          <span class="badge badge-present font-num" style="display: block; font-size: 0.65rem; margin-top: 2px;">PWA</span>
        </div>
      </div>

      <ul class="sidebar-menu">
        <li>
          <a href="#attendance" class="sidebar-link" data-route="#attendance">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span data-i18n="nav.attendance">الحضور اليومي</span>
          </a>
        </li>
        <li>
          <a href="#penalties" class="sidebar-link" data-route="#penalties">
            <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <span data-i18n="nav.penalties">الجزاءات</span>
          </a>
        </li>
        <li>
          <a href="#report" class="sidebar-link" data-route="#report">
            <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <span data-i18n="nav.report">التقرير الشهري</span>
          </a>
        </li>
        <li>
          <a href="#employees" class="sidebar-link" data-route="#employees" data-roles="admin">
            <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span data-i18n="nav.employees">الموظفون</span>
          </a>
        </li>
        <li>
          <a href="#settings" class="sidebar-link" data-route="#settings" data-roles="admin">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span data-i18n="nav.settings">الإعدادات</span>
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-action="toggle-theme" style="width: 100%; justify-content: flex-start;">
          <span class="theme-toggle-label">☀️</span>
          <span data-i18n="theme.toggle">المظهر</span>
        </button>
        <button type="button" class="btn btn-secondary btn-sm" data-action="toggle-lang" style="width: 100%; justify-content: flex-start;">
          <span>🌐</span>
          <span class="lang-toggle-label">English</span>
        </button>
        <button type="button" class="btn btn-danger btn-sm" data-action="logout" style="width: 100%; justify-content: flex-start;">
          <span>🚪</span>
          <span data-i18n="nav.logout">تسجيل الخروج</span>
        </button>
      </div>
    </aside>

    <!-- App Header (Top Bar) -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">د</div>
        <span class="brand-title" data-i18n="app.title">دوام</span>
      </div>

      <div class="header-controls">
        <span id="user-badge" class="badge badge-late font-num" style="display: none;">admin</span>
        
        <button type="button" class="btn btn-secondary btn-icon" data-action="toggle-theme" aria-label="Toggle Theme" title="Toggle Theme">
          <span class="theme-toggle-label">☀️</span>
        </button>

        <button type="button" class="btn btn-secondary btn-sm" data-action="toggle-lang" aria-label="Toggle Language" title="Toggle Language">
          <span class="lang-toggle-label">English</span>
        </button>

        <button type="button" class="btn btn-secondary btn-icon" data-action="logout" aria-label="Logout" title="Logout">
          <span>🚪</span>
        </button>
      </div>
    </header>

    <!-- Main Content Viewport -->
    <main class="app-main" id="main-content" role="main">
      <!-- Dynamic page content mounted here -->
    </main>

    <!-- Mobile Bottom Tab Bar (< 768px) -->
    <nav class="bottom-nav" aria-label="Mobile Bottom Navigation">
      <a href="#attendance" class="nav-tab" data-route="#attendance">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span data-i18n="nav.attendance">الحضور</span>
      </a>
      <a href="#penalties" class="nav-tab" data-route="#penalties">
        <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span data-i18n="nav.penalties">الجزاءات</span>
      </a>
      <a href="#report" class="nav-tab" data-route="#report">
        <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span data-i18n="nav.report">التقرير</span>
      </a>
      <a href="#more" class="nav-tab" id="tab-more">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        <span data-i18n="nav.more">المزيد</span>
      </a>
    </nav>

  </div>

  <!-- Application Entrypoint -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
