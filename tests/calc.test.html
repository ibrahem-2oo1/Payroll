<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dawam Calculation Engine Test Suite</title>
  <style>
    :root {
      --bg: #05070d;
      --card-bg: #0d1322;
      --border: #1a2744;
      --text: #f0f4fc;
      --text-muted: #8899b5;
      --cyan: #00f0ff;
      --green: #39ff88;
      --red: #ff3b5c;
      --amber: #ffb020;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem;
      margin: 0;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      color: var(--cyan);
      margin-top: 0;
      letter-spacing: 0.05em;
    }
    .summary-bar {
      display: flex;
      gap: 1rem;
      padding: 1rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
    }
    .badge-stat {
      font-weight: 700;
    }
    .text-green { color: var(--green); }
    .text-red { color: var(--red); }
    .text-cyan { color: var(--cyan); }

    .test-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .test-table th, .test-table td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .test-table th {
      background: #111a30;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.8rem;
    }
    .test-pass {
      color: var(--green);
      font-weight: 700;
    }
    .test-fail {
      color: var(--red);
      font-weight: 700;
    }
    .diff {
      color: var(--amber);
      font-family: monospace;
      font-size: 0.85rem;
    }
    pre {
      margin: 0;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dawam Calculation Engine — Test Suite</h1>
    <div id="summary" class="summary-bar">Running test suite...</div>

    <table class="test-table">
      <thead>
        <tr>
          <th style="width: 40px;">#</th>
          <th>Test Case</th>
          <th style="width: 130px;">Expected</th>
          <th style="width: 130px;">Actual</th>
          <th style="width: 90px;">Result</th>
        </tr>
      </thead>
      <tbody id="results-tbody">
      </tbody>
    </table>
  </div>

  <script type="module">
    import { calcDay, countPreviousLates, getLateNoForDate, buildMonth } from '../js/engine/calc.js';

    const defaultSettings = {
      shiftStart: '08:00',
      shiftEnd: '16:00',
      breakMinutes: 30,
      graceMinutes: 0,
      otCountedPer60: 52,
      otMinMinutes: 0,
      penaltyDayHours: 4,
      absentDayHours: 8,
      leavePaid: false,
      lateCounterReset: 'monthly',
      lateRules: [
        { id: 'r1', type: 'late_x', factor: 2, label: 'Late x 2' },
        { id: 'r2', type: 'late_x', factor: 3, label: 'Late x 3' },
        { id: 'r3', type: 'remaining_x', factor: 0.5, label: '(Remaining - break) / 2' }
      ]
    };

    const tests = [
      {
        name: '1. Standard full day (08:00–16:00)',
        run: () => {
          const res = calcDay({ in: '08:00', out: '16:00', status: 'present' }, defaultSettings, 1);
          return {
            expected: 'worked: 450, late: 0, ot: 0, regular: 450, net: 450',
            actual: `worked: ${res.worked}, late: ${res.late}, ot: ${res.ot}, regular: ${res.regular}, net: ${res.net}`,
            pass: res.worked === 450 && res.late === 0 && res.ot === 0 && res.regular === 450 && res.net === 450
          };
        }
      },
      {
        name: '2. 08:10–16:00, 1st late (Rule x2)',
        run: () => {
          const res = calcDay({ in: '08:10', out: '16:00', status: 'present' }, defaultSettings, 1);
          return {
            expected: 'worked: 440, ruleAmount: 20, deduction: 10, regular: 440, net: 430',
            actual: `worked: ${res.worked}, ruleAmount: ${res.ruleAmount}, deduction: ${res.lateDeduction}, regular: ${res.regular}, net: ${res.net}`,
            pass: res.worked === 440 && res.ruleAmount === 20 && res.lateDeduction === 10 && res.regular === 440 && res.net === 430
          };
        }
      },
      {
        name: '3. 08:10–16:00, 2nd late (Rule x3)',
        run: () => {
          const res = calcDay({ in: '08:10', out: '16:00', status: 'present' }, defaultSettings, 2);
          return {
            expected: 'worked: 440, ruleAmount: 30, deduction: 20, regular: 440, net: 420',
            actual: `worked: ${res.worked}, ruleAmount: ${res.ruleAmount}, deduction: ${res.lateDeduction}, regular: ${res.regular}, net: ${res.net}`,
            pass: res.worked === 440 && res.ruleAmount === 30 && res.lateDeduction === 20 && res.regular === 440 && res.net === 420
          };
        }
      },
      {
        name: '4. 08:10–16:00, 3rd late (Rule remaining x 0.5)',
        run: () => {
          // (16:00 - 08:10 = 470 - 30) / 2 = 220 total loss. Deduction = 220 - 10 = 210. Net = 440 - 210 = 230.
          const res = calcDay({ in: '08:10', out: '16:00', status: 'present' }, defaultSettings, 3);
          return {
            expected: 'ruleAmount: 220, deduction: 210, regular: 440, net: 230',
            actual: `ruleAmount: ${res.ruleAmount}, deduction: ${res.lateDeduction}, regular: ${res.regular}, net: ${res.net}`,
            pass: res.ruleAmount === 220 && res.lateDeduction === 210 && res.regular === 440 && res.net === 230
          };
        }
      },
      {
        name: '5. 08:10–16:00, 4th late in same month (Cycles back to Rule 1)',
        run: () => {
          // Rule 1: (4 - 1) % 3 = index 0 (Rule 1).
          const res = calcDay({ in: '08:10', out: '16:00', status: 'present' }, defaultSettings, 4);
          return {
            expected: 'ruleAmount: 20, deduction: 10, regular: 440, net: 430',
            actual: `ruleAmount: ${res.ruleAmount}, deduction: ${res.lateDeduction}, regular: ${res.regular}, net: ${res.net}`,
            pass: res.ruleAmount === 20 && res.lateDeduction === 10 && res.net === 430
          };
        }
      },
      {
        name: '6. Monthly counter reset: 2 lates in Nov + 1 late on 1 Dec',
        run: () => {
          const records = [
            { employeeId: 'e1', date: '2026-11-10', in: '08:10', out: '16:00', status: 'present' },
            { employeeId: 'e1', date: '2026-11-20', in: '08:10', out: '16:00', status: 'present' }
          ];
          const dec1LateNo = getLateNoForDate(records, 'e1', '2026-12-01', defaultSettings);
          const decRes = calcDay({ in: '08:10', out: '16:00', status: 'present' }, defaultSettings, dec1LateNo);
          return {
            expected: 'lateNo: 1, net: 430',
            actual: `lateNo: ${dec1LateNo}, net: ${decRes.net}`,
            pass: dec1LateNo === 1 && decRes.net === 430
          };
        }
      },
      {
        name: '7. Overtime 1 hour: 08:00–17:00 (60 OT -> 52 counted)',
        run: () => {
          const res = calcDay({ in: '08:00', out: '17:00', status: 'present' }, defaultSettings, 1);
          return {
            expected: 'otRaw: 60, ot: 52, regular: 450, net: 502',
            actual: `otRaw: ${res.otRaw}, ot: ${res.ot}, regular: ${res.regular}, net: ${res.net}`,
            pass: res.otRaw === 60 && res.ot === 52 && res.regular === 450 && res.net === 502
          };
        }
      },
      {
        name: '8. Overtime 30 mins: 08:00–16:30 (30 OT -> 26 counted)',
        run: () => {
          const res = calcDay({ in: '08:00', out: '16:30', status: 'present' }, defaultSettings, 1);
          return {
            expected: 'otRaw: 30, ot: 26, regular: 450, net: 476',
            actual: `otRaw: ${res.otRaw}, ot: ${res.ot}, regular: ${res.regular}, net: ${res.net}`,
            pass: res.otRaw === 30 && res.ot === 26 && res.regular === 450 && res.net === 476
          };
        }
      },
      {
        name: '9. Absent day (-8 hours = -480 mins)',
        run: () => {
          const res = calcDay({ status: 'absent' }, defaultSettings, 1);
          return {
            expected: 'net: -480',
            actual: `net: ${res.net}`,
            pass: res.net === -480
          };
        }
      },
      {
        name: '10. Leave day (leavePaid = false -> net 0)',
        run: () => {
          const res = calcDay({ status: 'leave' }, defaultSettings, 1);
          return {
            expected: 'net: 0',
            actual: `net: ${res.net}`,
            pass: res.net === 0
          };
        }
      },
      {
        name: '11. Night shift 22:00–06:00 handled (settings 22:00-06:00, break 30)',
        run: () => {
          const nightSettings = {
            ...defaultSettings,
            shiftStart: '22:00',
            shiftEnd: '06:00',
            breakMinutes: 30
          };
          const res = calcDay({ in: '22:00', out: '06:00', status: 'present' }, nightSettings, 1);
          return {
            expected: 'worked: 450, regular: 450, net: 450',
            actual: `worked: ${res.worked}, regular: ${res.regular}, net: ${res.net}`,
            pass: res.worked === 450 && res.regular === 450 && res.net === 450
          };
        }
      },
      {
        name: '12. Deleting Rule 3 (late #3 cycles with 2 rules to Rule 1)',
        run: () => {
          const settingsTwoRules = {
            ...defaultSettings,
            lateRules: [
              { id: 'r1', type: 'late_x', factor: 2 },
              { id: 'r2', type: 'late_x', factor: 3 }
            ]
          };
          // With 2 rules, (3 - 1) % 2 = 0 -> Rule 1
          const res = calcDay({ in: '08:10', out: '16:00', status: 'present' }, settingsTwoRules, 3);
          return {
            expected: 'ruleUsed: r1, deduction: 10, net: 430',
            actual: `ruleUsed: ${res.ruleUsed?.id}, deduction: ${res.lateDeduction}, net: ${res.net}`,
            pass: res.ruleUsed?.id === 'r1' && res.lateDeduction === 10 && res.net === 430
          };
        }
      },
      {
        name: '13. BUG 2 Fix: lateNo < 1 safety test (defaults to lateNo = 1)',
        run: () => {
          const res0 = calcDay({ in: '08:10', out: '16:00', status: 'present' }, defaultSettings, 0);
          const resUndef = calcDay({ in: '08:10', out: '16:00', status: 'present' }, defaultSettings, undefined);
          return {
            expected: 'res0.ruleUsed: r1, resUndef.ruleUsed: r1, deduction: 10',
            actual: `res0: ${res0.ruleUsed?.id}, resUndef: ${resUndef.ruleUsed?.id}, deduction: ${res0.lateDeduction}`,
            pass: res0.ruleUsed?.id === 'r1' && resUndef.ruleUsed?.id === 'r1' && res0.lateDeduction === 10
          };
        }
      },
      {
        name: '14. BUG 1 Fix & Edge 3: Late arrival with overtime (08:10–17:00, late #1 -> regular 440, OT 52, net 482)',
        run: () => {
          // Regular inside official window: min(17:00, 16:00) - max(08:10, 08:00) - 30 = 470 - 30 = 440
          // OT: 60 raw -> 52 counted. Late deduction: 10.
          // Net = 440 + 52 - 10 = 482 (NOT 492).
          const res = calcDay({ in: '08:10', out: '17:00', status: 'present' }, defaultSettings, 1);
          return {
            expected: 'regular: 440, ot: 52, deduction: 10, net: 482',
            actual: `regular: ${res.regular}, ot: ${res.ot}, deduction: ${res.lateDeduction}, net: ${res.net}`,
            pass: res.regular === 440 && res.ot === 52 && res.lateDeduction === 10 && res.net === 482
          };
        }
      },
      {
        name: '15. Edge 1: Grace period (graceMinutes = 15)',
        run: () => {
          const graceSettings = { ...defaultSettings, graceMinutes: 15 };
          const resInGrace = calcDay({ in: '08:10', out: '16:00', status: 'present' }, graceSettings, 1);
          const resPastGrace = calcDay({ in: '08:20', out: '16:00', status: 'present' }, graceSettings, 1);
          // In grace: late = 0, lateDeduction = 0, regular = 440, net = 440
          // Past grace: late = 20, ruleAmount = 40, deduction = 20, regular = 430, net = 410
          return {
            expected: 'resInGrace.late: 0 (net 440), resPastGrace.late: 20 (net 410)',
            actual: `resInGrace: late ${resInGrace.late}, net ${resInGrace.net}; resPastGrace: late ${resPastGrace.late}, net ${resPastGrace.net}`,
            pass: resInGrace.late === 0 && resInGrace.net === 440 && resPastGrace.late === 20 && resPastGrace.net === 410
          };
        }
      },
      {
        name: '16. Edge 2: Minimum OT threshold (otMinMinutes = 45)',
        run: () => {
          const otMinSettings = { ...defaultSettings, otMinMinutes: 45 };
          const resUnder = calcDay({ in: '08:00', out: '16:30', status: 'present' }, otMinSettings, 1);
          const resOver = calcDay({ in: '08:00', out: '16:50', status: 'present' }, otMinSettings, 1);
          // 16:30 -> otRaw 30 < 45 -> ot = 0, net = 450
          // 16:50 -> otRaw 50 >= 45 -> ot = round(50 * 52 / 60) = 43, net = 450 + 43 = 493
          return {
            expected: 'resUnder.ot: 0 (net 450), resOver.ot: 43 (net 493)',
            actual: `resUnder.ot: ${resUnder.ot}, net ${resUnder.net}; resOver.ot: ${resOver.ot}, net ${resOver.net}`,
            pass: resUnder.ot === 0 && resUnder.net === 450 && resOver.ot === 43 && resOver.net === 493
          };
        }
      },
      {
        name: '17. Edge 4: Penalty days & buildMonth salary (Rate 3000, 450m worked - 0.5 penalty day = 330m -> 16,500 IQD)',
        run: () => {
          const mockDb = {
            settings: defaultSettings,
            employees: [{ id: 'e1', rate: 3000, active: true }],
            attendance: [{ employeeId: 'e1', date: '2026-11-01', in: '08:00', out: '16:00', status: 'present' }],
            penalties: [{ employeeId: 'e1', date: '2026-11-05', days: 0.5 }]
          };
          const monthRes = buildMonth('e1', '2026-11', mockDb);
          // Worked 450m, penalty deduction: 0.5 days * 4 hrs * 60 = 120m.
          // Net = 450 - 120 = 330m (5.5 hrs). Salary = 5.5 * 3000 = 16500.
          return {
            expected: 'netMonth: 330, penalty: 120, salary: 16500',
            actual: `netMonth: ${monthRes.totals.netMonth}, penalty: ${monthRes.totals.penaltyDeductions}, salary: ${monthRes.totals.salary}`,
            pass: monthRes.totals.netMonth === 330 && monthRes.totals.penaltyDeductions === 120 && monthRes.totals.salary === 16500
          };
        }
      },
      {
        name: '18. Edge 5: Fixed hours late rule (1 hour = 60 mins total loss)',
        run: () => {
          const fixedHoursSettings = {
            ...defaultSettings,
            lateRules: [{ id: 'r_fixed', type: 'fixed_hours', hours: 1 }]
          };
          // Arrival 08:10 (late 10m). ruleAmount = 60m. Deduction = 60 - 10 = 50m.
          // Regular = 440m. Net = 440 - 50 = 390m.
          const res = calcDay({ in: '08:10', out: '16:00', status: 'present' }, fixedHoursSettings, 1);
          return {
            expected: 'ruleAmount: 60, deduction: 50, regular: 440, net: 390',
            actual: `ruleAmount: ${res.ruleAmount}, deduction: ${res.lateDeduction}, regular: ${res.regular}, net: ${res.net}`,
            pass: res.ruleAmount === 60 && res.lateDeduction === 50 && res.regular === 440 && res.net === 390
          };
        }
      },
      {
        name: '19. No double-counting of absences: 1 present (450) + 1 absent (480) -> netMonth = -30, not -510',
        run: () => {
          const mockDb = {
            settings: defaultSettings,
            employees: [{ id: 'e1', rate: 2500, active: true }],
            attendance: [
              { employeeId: 'e1', date: '2026-11-01', in: '08:00', out: '16:00', status: 'present' },
              { employeeId: 'e1', date: '2026-11-02', status: 'absent' }
            ],
            penalties: []
          };
          const monthRes = buildMonth('e1', '2026-11', mockDb);
          // 450 (present) - 480 (absent) = -30. absenceDeductions breakdown = 480.
          return {
            expected: 'netMonth: -30, absenceDeductions: 480',
            actual: `netMonth: ${monthRes.totals.netMonth}, absenceDeductions: ${monthRes.totals.absenceDeductions}`,
            pass: monthRes.totals.netMonth === -30 && monthRes.totals.absenceDeductions === 480
          };
        }
      },
      {
        name: '20. Salary guard: negative netMonth -> salary is 0 (never negative)',
        run: () => {
          const mockDb = {
            settings: defaultSettings,
            employees: [{ id: 'e1', rate: 3000, active: true }],
            attendance: [
              { employeeId: 'e1', date: '2026-11-02', status: 'absent' }
            ],
            penalties: []
          };
          const monthRes = buildMonth('e1', '2026-11', mockDb);
          // 1 absent day = -480 min. Rate 3000. Salary must be 0, not -24000.
          return {
            expected: 'netMonth: -480, salary: 0, hasNegativeNet: true',
            actual: `netMonth: ${monthRes.totals.netMonth}, salary: ${monthRes.totals.salary}, hasNegativeNet: ${monthRes.totals.hasNegativeNet}`,
            pass: monthRes.totals.netMonth === -480 && monthRes.totals.salary === 0 && monthRes.totals.hasNegativeNet === true
          };
        }
      }
    ];

    let passedCount = 0;
    const tbody = document.getElementById('results-tbody');

    tests.forEach((t, idx) => {
      let outcome;
      try {
        outcome = t.run();
      } catch (err) {
        outcome = { pass: false, expected: 'Execution without error', actual: `Error: ${err.message}` };
      }

      if (outcome.pass) passedCount++;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${idx + 1}</td>
        <td><strong>${t.name}</strong></td>
        <td><pre>${outcome.expected}</pre></td>
        <td><pre class="${outcome.pass ? '' : 'diff'}">${outcome.actual}</pre></td>
        <td class="${outcome.pass ? 'test-pass' : 'test-fail'}">${outcome.pass ? '✅ PASS' : '❌ FAIL'}</td>
      `;
      tbody.appendChild(tr);
    });

    const totalCount = tests.length;
    const failedCount = totalCount - passedCount;
    const allPassed = failedCount === 0;

    const summaryEl = document.getElementById('summary');
    summaryEl.innerHTML = `
      <span>Status: <strong class="${allPassed ? 'text-green' : 'text-red'}">${allPassed ? '✅ ALL TESTS PASSED' : '❌ SOME TESTS FAILED'}</strong></span>
      <span>Total: <span class="badge-stat text-cyan">${totalCount}</span></span>
      <span>Passed: <span class="badge-stat text-green">${passedCount}</span></span>
      <span>Failed: <span class="badge-stat ${failedCount > 0 ? 'text-red' : ''}">${failedCount}</span></span>
    `;

    // Expose results globally for automated test runners
    window.__CALC_TEST_RESULTS__ = {
      total: totalCount,
      passed: passedCount,
      failed: failedCount,
      allPassed
    };
  </script>
</body>
</html>
